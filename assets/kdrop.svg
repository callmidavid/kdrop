<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="kdropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7952f5"/>
      <stop offset="100%" stop-color="#4322b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <rect width="128" height="128" rx="28" fill="#141620"/>
  
  <!-- Outer glowing droplet shape -->
  <path d="M64 18 C64 18, 30 62, 30 84 A34 34 0 0 0 98 84 C98 62, 64 18, 64 18 Z" 
        fill="url(#kdropGrad)" 
        filter="url(#shadow)"/>
        
  <!-- Inner wireless signal arcs -->
  <path d="M46 80 A20 20 0 0 1 82 80" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.9"/>
        
  <path d="M53 87 A12 12 0 0 1 75 87" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        opacity="0.75"/>
        
  <!-- Center beacon dot -->
  <circle cx="64" cy="94" r="3.5" fill="#ffffff"/>
</svg>

