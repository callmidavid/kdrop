[package]
name = "kdrop"
version = "0.1.0"
edition = "2021"
description = "Fast, local file sharing for Linux, iPhone, Android, and more"
license = "MIT"

[[bin]]
name = "kdrop"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.7", features = ["multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Networking
uuid = { version = "1", features = ["v4"] }
socket2 = "0.5"

# QR code
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

# Native GUI
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"

# Streaming
tokio-stream = "0.1"
futures = "0.3"

# Platform utilities
directories = "5"
open = "5"
rfd = "0.14"
hostname = "0.4"
mime_guess = "2"

# HTTP client (for sending to peers)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local network IP detection
local-ip-address = "0.6"

# Base64 (for QR PNG embedding in web UI)
base64 = "0.22"
